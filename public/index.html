<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3ead6" />
<title>意大利 · 希腊 14 天旅行手册</title>
<style>
  /* ============ 主题变量：白天 / 黑夜 ============ */
  :root {
    --bg: #f3ead6;            /* 羊皮纸底 */
    --bg2: #efe3c8;
    --card: #fffdf5;
    --ink: #2e2a22;
    --ink-soft: #6b6350;
    --line: #d9cba7;
    --accent: #b4472e;        /* 印章红 */
    --accent2: #1f6f6b;       /* 墨绿 */
    --gold: #b8860b;
    --shadow: 0 6px 22px rgba(90,70,30,.14);
    --tape: rgba(180,140,60,.22);
    --radius: 16px;
  }
  html[data-theme="dark"] {
    --bg: #14161b;
    --bg2: #1b1e26;
    --card: #1e222b;
    --ink: #e9e4d6;
    --ink-soft: #9a927e;
    --line: #363b47;
    --accent: #e08165;
    --accent2: #5fbdb5;
    --gold: #d9b25a;
    --shadow: 0 6px 24px rgba(0,0,0,.45);
    --tape: rgba(210,180,110,.14);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 15% 0%, var(--bg2), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .5s ease, color .5s ease;
    padding: 0 0 60px;
    overflow-x: hidden;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  a { color: inherit; }

  /* ============ 顶栏 ============ */
  header.top {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; max-width: 760px; margin: 0 auto; }
  .brand { font-weight: 800; letter-spacing: .5px; font-size: 15px; }
  .brand small { display:block; font-weight: 500; color: var(--ink-soft); font-size: 11px; letter-spacing: 2px; }
  .theme-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }

  /* ============ 通用卡片 ============ */
  section { margin: 26px 0; }
  .sec-title { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; }
  .sec-title h2 { font-size: 19px; margin: 0; letter-spacing: .5px; }
  .sec-title .idx {
    font-family: Georgia, serif; font-style: italic; color: var(--accent);
    border: 1.5px solid var(--accent); border-radius: 50%; width: 26px; height: 26px;
    display: grid; place-items: center; font-size: 13px; flex: none;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
  }

  /* ============ 此刻关注 / 倒计时 ============ */
  .focus {
    position: relative;
    background: linear-gradient(160deg, var(--card), color-mix(in srgb, var(--card) 80%, var(--accent2) 8%));
    border: 1.5px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
    padding: 20px 18px 18px; margin-top: 18px; overflow: hidden;
  }
  .focus::before { /* 手撕胶带 */
    content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-2deg);
    width: 120px; height: 24px; background: var(--tape); border-radius: 3px;
  }
  .focus .eyebrow { font-size: 12px; letter-spacing: 3px; color: var(--accent); font-weight: 700; }
  .focus .ev-title { font-size: 22px; font-weight: 800; margin: 4px 0 2px; line-height: 1.25; }
  .focus .ev-meta { font-size: 13px; color: var(--ink-soft); }
  .focus .ev-meta b { color: var(--ink); font-weight: 600; }
  .countdown { display: flex; gap: 8px; margin-top: 14px; }
  .cd-cell { flex: 1; text-align: center; background: color-mix(in srgb, var(--bg) 60%, var(--card)); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; }
  .cd-num { font-size: clamp(24px, 8vw, 40px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -1px; }
  .cd-lab { font-size: 11px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 1px; }
  .focus .tz-note { margin-top: 12px; font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ============ 手绘地图 ============ */
  .map-card { padding: 8px; }
  svg.handmap { width: 100%; height: auto; display: block; border-radius: 12px; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 10px 8px 4px; font-size: 12px; color: var(--ink-soft); }
  .map-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .lg-line { width: 20px; height: 0; border-top: 3px dashed; border-radius: 2px; }

  /* ============ 预订信息 ============ */
  .booking { margin-bottom: 12px; }
  .booking:last-child { margin-bottom: 0; }
  .b-head { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; }
  .b-head .ico { font-size: 18px; }
  .flight-leg { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .flight-leg:first-of-type { border-top: 0; }
  .fl-city { font-weight: 700; font-size: 15px; }
  .fl-time { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .fl-mid { text-align: center; color: var(--accent2); font-size: 11px; }
  .fl-mid .plane { font-size: 15px; }
  .fl-no { font-size: 11px; color: var(--ink-soft); letter-spacing: .5px; }
  .pending {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; text-align: center;
    color: var(--ink-soft); font-size: 13px; background: repeating-linear-gradient(45deg, transparent, transparent 8px, color-mix(in srgb,var(--line) 30%, transparent) 8px, color-mix(in srgb,var(--line) 30%, transparent) 9px);
  }
  .pending b { color: var(--accent); }

  /* ============ 逐日行程 ============ */
  .day { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
  .day-head { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; user-select: none; }
  .day-badge { flex: none; width: 46px; text-align: center; }
  .day-badge .d { font-size: 10px; letter-spacing: 1px; color: #fff; background: var(--daycol,#888); border-radius: 6px 6px 0 0; padding: 1px 0; font-weight: 700; }
  .day-badge .date { font-size: 12px; font-weight: 700; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 6px 6px; padding: 2px 0; }
  .day-title { flex: 1; min-width: 0; }
  .day-title .rt { font-weight: 700; font-size: 15px; }
  .day-title .sleep { font-size: 12px; color: var(--ink-soft); }
  .day-title .sleep .bed { color: var(--accent2); }
  .chev { transition: transform .3s; color: var(--ink-soft); flex: none; }
  .day.open .chev { transform: rotate(180deg); }
  .day-body { display: none; padding: 0 14px 14px; }
  .day.open .day-body { display: block; animation: fade .3s; }
  @keyframes fade { from{opacity:0; transform: translateY(-4px)} to{opacity:1} }

  .day-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
  .btn {
    border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 50%, var(--card));
    color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn.primary { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .btn:active { transform: scale(.97); }

  .timeline { position: relative; margin-left: 4px; }
  .tl-item { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
  .tl-item:first-child { border-top: 0; }
  .tl-time { font-size: 12px; color: var(--accent2); font-weight: 700; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .tl-body .name { font-weight: 600; }
  .tl-body .loc-link { color: var(--accent2); text-decoration: none; border-bottom: 1px dotted var(--accent2); }
  .tl-body .desc { font-size: 13px; color: var(--ink-soft); }
  .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; font-weight: 700; }
  .tag.book { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb,var(--accent) 40%, transparent); }
  .tag.warn { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); border: 1px solid color-mix(in srgb,var(--gold) 45%, transparent); }

  .mini-map-box { display: none; margin: 4px 0 12px; border: 1px dashed var(--line); border-radius: 12px; overflow: hidden; }
  .mini-map-box.show { display: block; }

  /* ============ 待办 ============ */
  .todo-group { margin-bottom: 14px; }
  .todo-group h3 { font-size: 14px; margin: 0 0 6px; color: var(--accent2); }
  .todo-list { list-style: none; margin: 0; padding: 0; }
  .todo-list li { padding: 7px 0 7px 26px; position: relative; border-top: 1px dashed var(--line); font-size: 14px; }
  .todo-list li:first-child { border-top: 0; }
  .todo-list li::before { content: "□"; position: absolute; left: 4px; top: 6px; color: var(--ink-soft); font-size: 15px; }
  .todo-list li.done { color: var(--ink-soft); text-decoration: line-through; }
  .todo-list li.done::before { content: "☑"; color: var(--accent2); }

  /* ============ 贴士 ============ */
  .tips-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .tip { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--card); }
  .tip .t { font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
  .tip .c { font-size: 13.5px; color: var(--ink-soft); }
  @media (min-width: 560px) { .tips-grid { grid-template-columns: 1fr 1fr; } }

  footer { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 40px; }
  .stamp { display:inline-block; border: 2px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 4px 10px; transform: rotate(-4deg); font-weight: 800; letter-spacing: 2px; opacity: .8; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">意大利 · 希腊 <small>ITALY · GREECE 2026</small></div>
    <button class="theme-btn" id="themeBtn">◐ 自动</button>
  </div>
</header>

<div class="wrap">

  <!-- 1. 此刻关注 -->
  <div class="focus" id="focus">
    <div class="eyebrow">此刻关注 · NEXT UP</div>
    <div class="ev-title" id="evTitle">加载中…</div>
    <div class="ev-meta" id="evMeta"></div>
    <div class="countdown" id="countdown">
      <div class="cd-cell"><div class="cd-num" id="cdD">–</div><div class="cd-lab">天 DAYS</div></div>
      <div class="cd-cell"><div class="cd-num" id="cdH">–</div><div class="cd-lab">时 HRS</div></div>
      <div class="cd-cell"><div class="cd-num" id="cdM">–</div><div class="cd-lab">分 MIN</div></div>
      <div class="cd-cell"><div class="cd-num" id="cdS">–</div><div class="cd-lab">秒 SEC</div></div>
    </div>
    <div class="tz-note"><span class="dot"></span><span id="tzNote"></span></div>
  </div>

  <!-- 2. 行程总览地图 -->
  <section>
    <div class="sec-title"><span class="idx">II</span><h2>行程总览地图</h2></div>
    <div class="card map-card" id="overviewMapCard"></div>
  </section>

  <!-- 3. 已确认预订 -->
  <section>
    <div class="sec-title"><span class="idx">III</span><h2>已确认 · 机票 / 酒店 / 门票</h2></div>
    <div class="card" id="bookings"></div>
  </section>

  <!-- 4. 逐日行程 -->
  <section>
    <div class="sec-title"><span class="idx">IV</span><h2>逐日行程</h2></div>
    <div id="days"></div>
  </section>

  <!-- 5. 待办清单 -->
  <section>
    <div class="sec-title"><span class="idx">V</span><h2>待办清单</h2></div>
    <div class="card" id="todos"></div>
  </section>

  <!-- 6. 实用贴士 -->
  <section>
    <div class="sec-title"><span class="idx">VI</span><h2>实用贴士</h2></div>
    <div class="tips-grid" id="tips"></div>
  </section>

  <footer>
    <div class="stamp">BUON VIAGGIO · ΚΑΛΟ ΤΑΞΙΔΙ</div>
    <p>4 人同行 · 2026/09/27 – 10/11</p>
  </footer>
</div>

<script>
/* =====================================================================
   数据区：所有时间以「绝对时刻（带 UTC 偏移）」存储，倒计时用绝对时刻计算，
   因此无论在哪个时区打开都不会算错。显示时明确标注当地时区。
   意大利 = UTC+2（欧洲中部夏令时，10/25 前不变）
   希腊   = UTC+3（东欧夏令时，10/25 前不变）
   中国   = UTC+8
   ===================================================================== */

// 城市地图查询串（用于唤起 Google 地图）
const Q = (s) => encodeURIComponent(s);

// —— 关注事件（按时间排序，倒计时自动指向下一个未发生的事件）——

  { iso:"2026-09-27T08:55:00+08:00", title:"出发 · 虹桥 → 北京", meta:"虹桥组 08:55 起飞（浦东组 09:20 / CA8332）", tz:"上海时间 UTC+8" },

  { iso:"2026-10-06T09:00:00+03:00", title:"DAY10 · 雅典卫城", meta:"卫城 · 卫城博物馆 · 宪法广场换兵", tz:"雅典时间 UTC+3" },
  { iso:"2026-10-07T09:50:00+03:00", title:"雅典 → 扎金索斯", meta:"09:50 起飞，10:50 落地，下午自由", tz:"雅典时间 UTC+3" },

// —— 机票（已出票）——

  { seg:"去程 09/27", from:"上海 虹桥", to:"北京", dep:"08:55", arr:"11:40", no:"航班A（虹桥组 2 人）", tz:"上海时间 UTC+8" },

  { seg:"回程 10/10", from:"雅典 ATH", to:"北京", dep:"14:15", arr:"05:05⁺¹", no:"CA864", tz:"起飞雅典 UTC+3 / 落地北京 UTC+8" },
  { seg:"回程 10/11", from:"北京", to:"上海", dep:"07:30", arr:"10:00", no:"CA1507", tz:"北京时间 UTC+8" },
];

// —— 逐日行程 ——
// col = 该天颜色；stops = 有序地点（用于当天多点导航 & 迷你地图）
const DAYS = [
  { n:"DAY1", date:"09/27", dow:"周日", col:"#c9772e",
    route:"上海 → 罗马", sleep:"罗马 · Cavour 地铁站附近", mode:"transit",

  { n:"DAY2", date:"09/28", dow:"周一", col:"#b4472e",
    route:"罗马 · 古城核心", sleep:"罗马", mode:"walking",
    items:[
      { t:"全天", name:"斗兽场 + 古罗马广场 + 帕拉蒂尼山", q:"Colosseo, Roma", book:"联票·限时入场", desc:"斗兽场联票，务必按预约时段入场" },
    ],
    stops:[{name:"斗兽场", q:"Colosseo, Roma"},{name:"古罗马广场", q:"Foro Romano, Roma"},{name:"帕拉蒂尼山", q:"Palatino, Roma"}] },

  { n:"DAY3", date:"09/29", dow:"周二", col:"#b4472e",

const $ = (id) => document.getElementById(id);
const mapsNav = (q) => `https://www.google.com/maps/dir/?api=1&destination=${Q(q)}`;
const mapsMulti = (stops, mode) => {
  if (!stops.length) return null;
  const pts = stops.map(s => s.q);
  const origin = pts[0];
  const destination = pts[pts.length - 1];
  const way = pts.slice(1, -1).map(Q).join("%7C");
  let url = `https://www.google.com/maps/dir/?api=1&origin=${Q(origin)}&destination=${Q(destination)}&travelmode=${mode||"walking"}`;
  if (way) url += `&waypoints=${way}`;
  return url;
};

/* ---- 倒计时 ---- */
function pad(n){ return String(n).padStart(2,"0"); }
function tick(){
  const now = Date.now();
  let ev = EVENTS.find(e => new Date(e.iso).getTime() > now);
  if (!ev){
    $("evTitle").textContent = "旅程已圆满结束 🏠";
    $("evMeta").textContent = "欢迎回家！";
    $("tzNote").textContent = "";
    ["cdD","cdH","cdM","cdS"].forEach(k=>$(k).textContent="0");
    return;
  }
  $("evTitle").textContent = ev.title;
  $("evMeta").innerHTML = ev.meta ? `<b>${ev.meta}</b>` : "";
  $("tzNote").textContent = "锚点时间：" + ev.tz + "（倒计时按绝对时刻计算，任意时区打开都准确）";
  let diff = Math.max(0, new Date(ev.iso).getTime() - now);
  const d = Math.floor(diff/86400000); diff -= d*86400000;
  const h = Math.floor(diff/3600000); diff -= h*3600000;
  const m = Math.floor(diff/60000); diff -= m*60000;
  const s = Math.floor(diff/1000);
  $("cdD").textContent = d;
  $("cdH").textContent = pad(h);
  $("cdM").textContent = pad(m);
  $("cdS").textContent = pad(s);
}

/* ---- 逐日行程 ---- */
function renderDays(){
  const box = $("days");
  box.innerHTML = DAYS.map((d, i) => {
    const items = d.items.map(it => {
      const nameHtml = it.q
        ? `<a class="loc-link" href="${mapsNav(it.q)}" target="_blank" rel="noopener">${it.name} ↗</a>`
        : `<span>${it.name}</span>`;
      const tags = (it.book ? `<span class="tag book">需订 ${it.book}</span>` : "")
                 + (it.warn ? `<span class="tag warn">${it.warn}</span>` : "");
      return `<div class="tl-item">
        <div class="tl-time">${it.t}</div>
        <div class="tl-body"><div class="name">${nameHtml}${tags}</div>${it.desc?`<div class="desc">${it.desc}</div>`:""}</div>
      </div>`;
    }).join("");

    const multi = mapsMulti(d.stops, d.mode);
    const actions = `<div class="day-actions">
      ${d.stops.length ? `<button class="btn" onclick="toggleMini(${i})">🗺️ 当日路线图</button>` : ""}
      ${multi ? `<a class="btn primary" href="${multi}" target="_blank" rel="noopener">🧭 一键全天多点导航</a>` : ""}
    </div>`;

    const mini = d.stops.length ? `<div class="mini-map-box" id="mini${i}">${miniMapSVG(d)}</div>` : "";

    return `<div class="day" data-i="${i}" style="--daycol:${d.col}">
      <div class="day-head" onclick="toggleDay(${i})">
        <div class="day-badge"><div class="d">${d.n}</div><div class="date">${d.date}</div></div>
        <div class="day-title"><div class="rt">${d.route}</div><div class="sleep"><span class="bed">🛏</span> 住：${d.sleep} · ${d.dow}</div></div>
        <div class="chev">▾</div>
      </div>
      <div class="day-body">
        ${actions}
        ${mini}
        <div class="timeline">${items}</div>
      </div>
    </div>`;
  }).join("");
}
function toggleDay(i){ document.querySelector(`.day[data-i="${i}"]`).classList.toggle("open"); }
function toggleMini(i){ event.stopPropagation(); $("mini"+i).classList.toggle("show"); }

/* ---- 当日迷你路线图（简易手绘）---- */
function miniMapSVG(d){
  const n = d.stops.length;
  const W = 320, H = 40 + n*46;
  let pts = d.stops.map((s, k) => ({ x: 40 + (k%2)*0, y: 30 + k*46, s }));
  // 交错左右，走线更像路线
  pts = d.stops.map((s,k)=>({ x: (k%2===0? 60 : 200), y: 30 + k*44, s }));
  let path = "";
  pts.forEach((p,k)=>{ path += (k===0?`M ${p.x} ${p.y}`:` L ${p.x} ${p.y}`); });
  const nodes = pts.map((p,k)=>`
    <circle cx="${p.x}" cy="${p.y}" r="7" fill="${d.col}" filter="url(#rough2)"/>
    <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${k+1}</text>
    <text x="${p.x+14}" y="${p.y+4}" font-size="12" fill="var(--ink)">${p.s.name}</text>`).join("");
  const H2 = 30 + pts.length*44 + 10;
  return `<svg class="handmap" viewBox="0 0 320 ${H2}" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="rough2"><feTurbulence baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter></defs>
    <path d="${path}" fill="none" stroke="${d.col}" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" filter="url(#rough2)"/>
    ${nodes}
  </svg>`;
}

/* ---- 总览手绘地图 ---- */
function renderOverview(){

    zante:{x:630,y:445,label:"扎金索斯",n:"2晚"},
  };
  // 路线段：[from,to,color,glyph,label]
  const legs = [
    ["roma","firenze","#2e7d5b","🚄","10/1 高铁"],
    ["firenze","napoli","#1f6f6b","🚄","10/3 高铁"],
    ["napoli","capri","#1f6f6b","⛴️","10/4 船"],
    ["napoli","athina","#8e44ad","✈️","10/5 飞"],
    ["athina","zante","#d4930b","✈️","10/7 飞"],
    ["zante","athina","#2e6fb0","✈️","10/9 飞"],
  ];
  const bezier = (a,b) => {
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2 - 34;
    return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
  };
  let paths = legs.map(([f,t,c],idx)=>{
    const a=P[f],b=P[t];
    return `<path d="${bezier(a,b)}" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round" filter="url(#rough)"/>`;
  }).join("");
  let glyphs = legs.map(([f,t,c,g,lab])=>{
    const a=P[f],b=P[t]; const mx=(a.x+b.x)/2, my=(a.y+b.y)/2-30;
    return `<text x="${mx}" y="${my}" text-anchor="middle" font-size="15">${g}</text>
            <text x="${mx}" y="${my+15}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${lab}</text>`;
  }).join("");
  let nodes = Object.values(P).map(p=>`
    <g>
      <circle cx="${p.x}" cy="${p.y}" r="9" fill="var(--accent)" filter="url(#rough)"/>
      <text x="${p.x}" y="${p.y-14}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${p.label}</text>
      ${p.n?`<text x="${p.x}" y="${p.y+22}" text-anchor="middle" font-size="10" fill="var(--accent2)">🛏 ${p.n}</text>`:""}
    </g>`).join("");
  // 进出港箭头
  const inout = `
    <text x="${P.roma.x-40}" y="${P.roma.y-40}" font-size="12" fill="var(--ink-soft)">✈️ 上海飞入</text>
    <path d="M ${P.roma.x-55} ${P.roma.y-30} Q ${P.roma.x-30} ${P.roma.y-20} ${P.roma.x-9} ${P.roma.y-6}" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="4 4" filter="url(#rough)"/>
    <text x="${P.athina.x-10}" y="${P.athina.y+50}" font-size="12" fill="var(--ink-soft)">✈️ 飞回上海</text>
    <path d="M ${P.athina.x} ${P.athina.y+10} Q ${P.athina.x+10} ${P.athina.y+30} ${P.athina.x+5} ${P.athina.y+40}" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="4 4" filter="url(#rough)"/>`;

  const svg = `<svg class="handmap" viewBox="0 40 900 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter>
    </defs>
    <text x="120" y="90" font-size="20" font-weight="800" fill="var(--ink-soft)" opacity="0.5" font-style="italic">🇮🇹 Italia</text>
    <text x="650" y="120" font-size="20" font-weight="800" fill="var(--ink-soft)" opacity="0.5" font-style="italic">🇬🇷 Ελλάδα</text>
    ${paths}${glyphs}${inout}${nodes}
  </svg>`;
  $("overviewMapCard").innerHTML = svg + `
    <div class="map-legend">
      <span><i class="lg-line" style="border-color:#2e7d5b"></i>火车</span>
      <span><i class="lg-line" style="border-color:#8e44ad"></i>意→希 飞</span>
      <span><i class="lg-line" style="border-color:#d4930b"></i>去海岛</span>
      <span><i class="lg-line" style="border-color:#2e6fb0"></i>回雅典</span>
      <span>🛏 = 每晚落脚点</span>
    </div>`;
}

/* ---- 主题：白天/黑夜自动切换 ---- */
let themeMode = "auto"; // auto | light | dark
function applyTheme(){
  let theme;
  if (themeMode === "auto"){
    const h = new Date().getHours();
    theme = (h >= 7 && h < 19) ? "light" : "dark";
    $("themeBtn").textContent = "◐ 自动";
  } else {
    theme = themeMode;
    $("themeBtn").textContent = themeMode === "light" ? "☀ 白天" : "🌙 黑夜";
  }
  document.documentElement.setAttribute("data-theme", theme);
  document.querySelector('meta[name=theme-color]').setAttribute("content", theme==="dark"?"#14161b":"#f3ead6");
}
$("themeBtn").addEventListener("click", ()=>{
  themeMode = themeMode === "auto" ? "light" : themeMode === "light" ? "dark" : "auto";
  applyTheme();
});

// 默认展开「下一个未过去的行程日」
(function openNextDay(){
  const today = new Date();
  const idx = DAYS.findIndex(d=>{
    const [mm,dd] = d.date.split("/").map(Number);
    const dt = new Date(2026, mm-1, dd, 23, 59);
    return dt.getTime() >= today.getTime();
  });
  if (idx >= 0) document.querySelector(`.day[data-i="${idx}"]`)?.classList.add("open");
})();
